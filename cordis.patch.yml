# Bundle layer for dsh-compaction-adaptive.
#
# Two halves, two homes:
#
# 1. The compaction backend (`ctx.compaction`) lives where the Agent preset
#    declares its compaction group, so the preset row mounts it (see
#    docs/DETAIL.md) — not here.
# 2. The insight panel's host half registers a *session projection*, a host-level
#    registry the browser reads. That row belongs to the profile, so it is
#    inserted here.
- insert:
    - id: compaction-insight
      name: 'dsh-compaction-adaptive/insight-host'
