# Bundle layer for dsh-compaction-adaptive.
#
# One package, two rows, and the row name decides what loads:
#
# - This row names the **package root**, which is the insight panel's host half.
#   It has to be an exact package specifier: `dsh-client-modules` treats a row
#   whose name carries a subpath as "not a client row" and never loads the
#   `./client` bundle, so no panel entry would ever appear.
# - The compaction backend is `dsh-compaction-adaptive/engine`, mounted by the
#   Agent preset inside its `compaction` group (see docs/DETAIL.md). That row is
#   deliberately a subpath, so it stays a host-only row.
- insert:
    - id: compaction-insight
      name: 'dsh-compaction-adaptive'
