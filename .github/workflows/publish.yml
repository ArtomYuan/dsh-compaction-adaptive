# Publish to npm from a tag: stage from CI, approve as a human.
#
# The workflow stages the tarball (no token, no 2FA); a maintainer then approves
# the staged version with 2FA on npmjs.com (Staged Packages) or with
# `npm stage approve <id>`. Approval is the human gate: an OIDC token cannot
# perform it, by design.
#
# Setup, once: register this workflow as the package's trusted publisher with
#   npm trust github dsh-compaction-adaptive \
#     --file publish.yml --repo ArtomYuan/dsh-compaction-adaptive --allow-stage-publish
# Stage-only means a direct `npm publish` from this workflow is rejected. The
# very first version was published by hand, because npm only exposes trusted
# publisher settings for a package that already exists (npm/cli#8544).
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required by trusted publishing: lets npm exchange this workflow's identity
  # for a short-lived, workflow-scoped credential.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run the checks
        run: |
          node test/policy.test.mjs
          node test/chunking.test.mjs
          node test/adaptive-chunking.test.mjs

  stage:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure a staged-publishing-capable npm (>= 11.15.0)
        run: npm install -g npm@latest
      - name: Stage the release
        # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment and requests a
        # short-lived credential instead of falling back to a stored token.
        run: npm stage publish --access public
